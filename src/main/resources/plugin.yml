name: SpawnerPickaxe
version: '1.0.0'
main: ru.spawnerpickaxe.SpawnerPickaxe
api-version: '1.21'
description: Незеритовая кирка для добычи спавнеров — одноразовая, без чар и починки.
author: YourName

commands:
  givespawnerpick:
    description: Выдать кирку для спавнеров
    usage: /givespawnerpick [игрок]
    permission: spawnerpickaxe.give

permissions:
  spawnerpickaxe.give:
    description: Позволяет выдавать кирку для спавнеров
    default: op