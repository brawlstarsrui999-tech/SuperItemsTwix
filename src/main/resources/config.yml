# ============================================
#   SpawnerPickaxe — Конфигурация
# ============================================
# Поддержка цветовых кодов: &a-&f, &0-&9, &l, &m, &n, &o, &r
# HEX цвета: &#rrggbb (например &#a855f7)

# Настройки кирки
pickaxe:
  display-name: "&#a855f7⛏ &#d4af37Кирка Спавнера &#a855f7⛏"
  lore:
    - "&#c7c7c7Может сломать только спавнер!"
    - "&#ff5555⚠ Одноразовая — исчезнет после использования"
    - ""
    - "&fТип моба сохраняется при добыче"

# Сообщения
messages:
  # Когда игрок ломает не-спавнер
  cannot-break: "&#ff5555Эта кирка может сломать только спавнер!"

  # Когда спавнер успешно сломан
  # %type% — тип моба (ZOMBIE, SKELETON, и т.д.)
  spawner-broken: "&#55ff55Спавнер (&#55ffff%type%&#55ff55) добыт! Кирка разрушена..."

  # Когда пытаются зачаровать
  cannot-enchant: "&#ff5555Эту кирку нельзя зачаровать!"

  # Когда пытаются починить
  cannot-repair: "&#ff5555Эту кирку нельзя починить или зачаровать!"

  # При получении кирки
  pickaxe-received: "&#55ff55Вы получили &#d4af37Кирку Спавнера&#55ff55!"

  # При выдаче кирки другому игроку
  # %player% — имя игрока
  pickaxe-given: "&#55ff55Кирка выдана игроку &f%player%&#55ff55!"

  # Нет прав
  no-permission: "&#ff5555У вас нет прав на эту команду!"

  # Игрок не найден
  player-not-found: "&#ff5555Игрок не найден!"